<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Salik Project Admin</title>
<style>
  :root { --bg:#14100b; --card:#1f1811; --line:#3a2e20; --gold:#d9a441; --text:#f3ece1; --muted:#a8997f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; color:var(--gold); }
  main { max-width:960px; margin:0 auto; padding:24px; }
  button, input { font:inherit; }
  button { background:var(--gold); color:#1a1208; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  input[type=text], input[type=password], input[type=search] { background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 12px; width:100%; }
  #login { max-width:340px; margin:15vh auto; display:grid; gap:12px; }
  #login p { color:var(--muted); margin:0; }
  .err { color:#ff8a7a; min-height:1.2em; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .tab { background:var(--card); color:var(--text); border:1px solid var(--line); }
  .tab.active { background:var(--gold); color:#1a1208; border-color:var(--gold); }
  .tab span { opacity:.7; margin-left:6px; font-weight:400; }
  .bar { display:flex; gap:10px; margin-bottom:16px; }
  .sub { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  .sub summary { list-style:none; cursor:pointer; padding:12px 16px; display:grid; grid-template-columns: 1fr auto; gap:4px 12px; }
  .sub summary::-webkit-details-marker { display:none; }
  .who { font-weight:600; }
  .email { color:var(--gold); }
  .when { color:var(--muted); font-size:13px; text-align:right; }
  .form-tag { color:var(--muted); font-size:12px; }
  .fields { padding:4px 16px 14px; border-top:1px solid var(--line); display:grid; gap:10px; }
  .field b { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .field div { white-space:pre-wrap; overflow-wrap:anywhere; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1>Salik Project Admin</h1>
  <div id="actions" hidden>
    <button class="ghost" id="refresh">Refresh</button>
    <button class="ghost" id="logout">Log out</button>
  </div>
</header>

<form id="login">
  <p>Enter the admin password to view submissions.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
  <div class="err" id="loginErr"></div>
</form>

<main id="app" hidden>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <input type="search" id="search" placeholder="Search name, email or message">
    <button class="ghost" id="csv">Export CSV</button>
  </div>
  <div class="meta" id="meta"></div>
  <div id="list"></div>
</main>

<script>
(function () {
  var data = null, active = 0, password = '';
  var $ = function (id) { return document.getElementById(id); };

  function fmt(d) {
    return new Date(d).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;   // textContent only: submissions are untrusted input
    return e;
  }

  function load() {
    $('loginErr').textContent = '';
    return fetch('/.netlify/functions/admin-submissions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Error'); return j; });
    }).then(function (j) {
      data = j;
      sessionStorage.setItem('salik-admin-pw', password);
      $('login').hidden = true; $('app').hidden = false; $('actions').hidden = false;
      render();
    }).catch(function (e) {
      sessionStorage.removeItem('salik-admin-pw');
      $('login').hidden = false; $('app').hidden = true; $('actions').hidden = true;
      $('loginErr').textContent = e.message;
    });
  }

  function current() {
    var g = data.groups[active];
    var q = $('search').value.trim().toLowerCase();
    if (!q) return g.submissions;
    return g.submissions.filter(function (s) {
      return (s.name + ' ' + s.email + ' ' + Object.values(s.fields).join(' ')).toLowerCase().indexOf(q) !== -1;
    });
  }

  function render() {
    var tabs = $('tabs'); tabs.textContent = '';
    data.groups.forEach(function (g, i) {
      var b = el('button', 'tab' + (i === active ? ' active' : ''), g.label);
      b.appendChild(el('span', '', String(g.submissions.length)));
      b.onclick = function () { active = i; render(); };
      tabs.appendChild(b);
    });
    var rows = current();
    $('meta').textContent = rows.length + ' shown. Last loaded ' + fmt(data.fetched_at) + '.';
    var list = $('list'); list.textContent = '';
    if (!rows.length) { list.appendChild(el('div', 'empty', 'No submissions.')); return; }
    rows.forEach(function (s) {
      var d = el('details', 'sub');
      var sm = el('summary');
      var left = el('div');
      left.appendChild(el('div', 'who', s.name || '(no name)'));
      left.appendChild(el('div', 'email', s.email || '(no email)'));
      var right = el('div');
      right.appendChild(el('div', 'when', fmt(s.created_at)));
      right.appendChild(el('div', 'when form-tag', s.form));
      sm.appendChild(left); sm.appendChild(right);
      d.appendChild(sm);
      var f = el('div', 'fields');
      Object.keys(s.fields).forEach(function (k) {
        var row = el('div', 'field');
        row.appendChild(el('b', '', k.replace(/[-_]/g, ' ')));
        row.appendChild(el('div', '', String(s.fields[k])));
        f.appendChild(row);
      });
      d.appendChild(f);
      list.appendChild(d);
    });
  }

  function csv() {
    var rows = current();
    var keys = [];
    rows.forEach(function (s) { Object.keys(s.fields).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); }); });
    var head = ['date', 'form', 'name', 'email'].concat(keys);
    var esc = function (v) {
      v = String(v == null ? '' : v);
      if (/^[=+\-@]/.test(v)) v = "'" + v;           // stop spreadsheet formula injection
      return '"' + v.replace(/"/g, '""') + '"';
    };
    var lines = [head.map(esc).join(',')];
    rows.forEach(function (s) {
      lines.push([s.created_at, s.form, s.name, s.email].concat(keys.map(function (k) { return s.fields[k]; })).map(esc).join(','));
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
    a.download = 'salik-' + data.groups[active].key + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
  }

  $('login').onsubmit = function (e) { e.preventDefault(); password = $('pw').value; load(); };
  $('refresh').onclick = load;
  $('logout').onclick = function () { sessionStorage.removeItem('salik-admin-pw'); location.reload(); };
  $('search').oninput = render;
  $('csv').onclick = csv;

  var saved = sessionStorage.getItem('salik-admin-pw');
  if (saved) { password = saved; load(); }
})();
</script>
</body>
</html>
